<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E7C86">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Nährwert-Tracker</title>
<style>
:root{--bg:#F4F7F6;--surface:#fff;--ink:#15252B;--muted:#5C6E75;--line:#D9E2E4;--track:#DCE4E6;--accent:#0E7C86;--on-accent:#fff;--red:#D64545;--yellow:#E3A008;--green:#2E9E5B}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#172429;--ink:#E7EFF1;--muted:#93A6AD;--line:#2A3B41;--track:#2C3E45;--accent:#3FB5C0;--on-accent:#082329;--red:#F0786E;--yellow:#F2C14E;--green:#4CC38A}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:520px;margin:0 auto;padding:18px 16px 110px}
h1{font-size:1.5rem;margin:4px 0 6px;letter-spacing:-.01em}
h2{font-size:1rem;margin:22px 0 10px;color:var(--muted);font-weight:600}
h3{font-size:1rem;margin:0 0 2px}
p{margin:0}.muted{color:var(--muted);font-size:.92rem}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.back{display:inline-block;padding:8px 0;color:var(--accent);font-weight:600}
.card,.panel{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.panel{display:block}
a.card:active{background:var(--bg)}
.info{flex:1;min-width:0}
.ring{width:68px;height:68px;flex:none}.ring.big{width:96px;height:96px}
.ring path{stroke:var(--c)}
.l-r{--c:var(--red)}.l-y{--c:var(--yellow)}.l-g{--c:var(--green)}.l-x{--c:var(--track)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:6px}
.cell{font-size:.85rem;line-height:1.25}
.cell b{display:block;font-weight:600}.cell small{color:var(--muted);font-size:.8rem}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.seg label{display:block;text-align:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600;cursor:pointer}
.seg input{position:absolute;opacity:0}
.seg input:checked+span{color:var(--accent)}
.seg label:has(input:checked){border:2px solid var(--accent);padding:11px}
.seg label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.photo-btn{width:100%;min-height:56px;border:2px dashed var(--line);border-radius:12px;background:none;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
#preview{width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin-top:12px}
.text-btn{background:none;border:none;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;padding:8px 0}
label.l{display:block;font-weight:600;margin-bottom:6px}
textarea{width:100%;min-height:90px;padding:12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px}
.primary{display:block;width:100%;min-height:54px;line-height:54px;text-align:center;border:none;border-radius:12px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;padding:0}
.primary:disabled{opacity:.4;cursor:not-allowed}
.del{margin-top:6px;background:none;border:none;color:var(--red);font:inherit;font-size:.85rem;font-weight:600;padding:6px 0;cursor:pointer}
.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(20px + env(safe-area-inset-bottom,0));width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:2rem;line-height:58px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.row{display:flex;gap:14px;align-items:center;margin:8px 0 14px}
.chk{display:flex;align-items:center;gap:12px;padding:8px 0;font-weight:500;cursor:pointer}.chk input{width:22px;height:22px;accent-color:var(--accent)}
.cmt{margin:10px 0 0;padding-left:10px;border-left:3px solid var(--accent);font-size:.9rem;line-height:1.4}
.top{display:flex;justify-content:space-between;align-items:center}.gear{font-size:1.6rem;padding:6px 10px;color:var(--muted)}
.num{width:100%;padding:12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px}
.err{color:var(--red);font-weight:600;margin-top:10px}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== Konfiguration ===== */
const LEVELS = ["sehr niedrig", "niedrig", "gut", "hoch", "sehr hoch"];
const COLOR  = ["r", "y", "g", "y", "r"];
const FILL   = [1 / 8, 1 / 4, 1 / 2, 3 / 4, 1];   // Füllgrad des Viertels je Stufe
// Reihenfolge = Reihenfolge im Ring (im Uhrzeigersinn ab 12 Uhr). s = Kürzel im großen Ring, u = Einheit
const NUTR = [
  {k: "kcal",    n: "Kalorien",      s: "Kal", u: "kcal"},
  {k: "carbs",   n: "Kohlenhydrate", s: "KH",  u: "g"},
  {k: "fat",     n: "Fett",          s: "F",   u: "g"},
  {k: "sugar",   n: "Zucker",        s: "Z",   u: "g"},
  {k: "protein", n: "Proteine",      s: "P",   u: "g"},
  {k: "fiber",   n: "Ballaststoffe", s: "B",   u: "g"}
];
// Grenzen t1..t4 in Gramm. Stufen: <t1 sehr niedrig | t1-t2 niedrig | t2-t3 gut | t3-t4 hoch | >=t4 sehr hoch
// Grobe Orientierungswerte (Annahmen, keine medizinische Empfehlung) – hier kannst du sie anpassen.
const DEFAULT_LIMITS = {
  day:   {kcal: [1200, 1600, 2400, 3000], carbs: [100, 160, 300, 380], fat: [25, 45, 90, 120], sugar: [15, 25, 50, 75], protein: [35, 55, 100, 140], fiber: [10, 20, 40, 55]},
  meal:  {kcal: [250, 400, 800, 1000],    carbs: [25, 45, 100, 130],   fat: [8, 15, 30, 40],    sugar: [3, 8, 17, 25],   protein: [10, 18, 35, 50],   fiber: [3, 6, 13, 18]},
  snack: {kcal: [60, 120, 300, 450],      carbs: [5, 12, 35, 55],      fat: [2, 5, 12, 18],     sugar: [2, 5, 12, 20],   protein: [2, 5, 12, 20],     fiber: [1, 2, 5, 8]}
};
// ergänzt fehlende Werte älterer gespeicherter Limits durch die Standardwerte
const withDefaults = L => {
  const o = {};
  for (const c in DEFAULT_LIMITS) { o[c] = {}; for (const k in DEFAULT_LIMITS[c]) o[c][k] = (L && L[c] && L[c][k]) || DEFAULT_LIMITS[c][k]; }
  return o;
};
let LIMITS = DEFAULT_LIMITS;
// Dummy-Gerichte: [Name, Fett, Zucker, Protein, Ballaststoffe, Kohlenhydrate] in g; Kalorien = 9*Fett + 4*Protein + 4*Kohlenhydrate
const POOL = {
  meal: [
    ["Haferflocken mit Beeren und Joghurt", 9, 14, 16, 8, 55], ["Vollkornbrot mit Käse und Gurke", 14, 3, 19, 7, 38],
    ["Spaghetti Bolognese", 22, 10, 32, 6, 80], ["Hähnchen mit Reis und Brokkoli", 10, 3, 42, 6, 60],
    ["Gemüsecurry mit Linsen", 15, 9, 17, 14, 62], ["Pizza Salami", 34, 8, 28, 5, 90],
    ["Croissant mit Marmelade", 18, 22, 6, 2, 50], ["Currywurst mit Pommes", 52, 12, 24, 5, 70],
    ["Lachs mit Kartoffeln und Salat", 24, 3, 36, 6, 35], ["Linsensuppe", 6, 5, 16, 13, 40],
    ["Salat mit Feta", 20, 6, 14, 6, 15]
  ],
  snack: [
    ["Apfel", 0, 19, 1, 4, 25], ["Handvoll Mandeln", 14, 1, 6, 3, 5], ["Schokoriegel", 12, 24, 3, 1, 30],
    ["Naturjoghurt mit Nüssen", 10, 7, 9, 1, 10], ["Proteinriegel", 8, 6, 20, 3, 18],
    ["Karotten mit Hummus", 8, 7, 4, 7, 18], ["Kartoffelchips", 15, 1, 2, 2, 14]
  ]
};

/* ===== Datum ===== */
const WD = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const label = s => { const d = parse(s); return WD[d.getDay()] + " - " + pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + d.getFullYear(); };
const daysAgo = i => { const d = new Date(); d.setDate(d.getDate() - i); return ymd(d); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

/* ===== Daten ===== */
const KEY = "naehrwerte.v1";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pv = p => ({name: p[0], fat: p[1], sugar: p[2], protein: p[3], fiber: p[4], carbs: p[5], kcal: Math.round(9 * p[1] + 4 * p[3] + 4 * p[5])});
const mk = (date, type, time, r) => ({id: uid(), date, type, time, name: r.name, fat: r.fat, sugar: r.sugar, protein: r.protein, fiber: r.fiber, carbs: r.carbs, kcal: r.kcal, comment: r.comment || ""});

function seed() {   // Dummydaten für die letzten 14 Tage (Tag vor 5 Tagen bleibt bewusst leer)
  let s = 7;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const out = [];
  for (let i = 0; i < 14; i++) {
    if (i === 5) continue;
    const slots = i === 0 ? [["meal", "07:30"], ["snack", "10:00"]]
                          : [["meal", "07:30"], ["meal", "12:30"], ["meal", "19:00"]];
    if (i && rnd() < .6) slots.push(["snack", "15:30"]);
    if (i && rnd() < .3) slots.push(["snack", "21:00"]);
    slots.forEach(([type, time]) => out.push(mk(daysAgo(i), type, time, pv(pick(POOL[type])))));
  }
  return out;
}
function load() { try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {} return seed(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(meals)); } catch (e) {} }
let meals = load();

const DKEY = "naehrwerte.dishes.v1";
const dishOf = (p, type) => ({id: uid(), type, ...pv(p)});
let dishes = [];
try {
  const r = localStorage.getItem(DKEY);   // beim ersten Start drei Dummy-Gerichte
  dishes = r ? JSON.parse(r) : [dishOf(POOL.meal[0], "meal"), dishOf(POOL.meal[3], "meal"), dishOf(POOL.snack[1], "snack")];
} catch (e) {}
function saveDishes() { try { localStorage.setItem(DKEY, JSON.stringify(dishes)); } catch (e) {} }
function addDish(r, type) { dishes.push({id: uid(), name: r.name, type, fat: r.fat, sugar: r.sugar, protein: r.protein, fiber: r.fiber, carbs: r.carbs, kcal: r.kcal, comment: r.comment || ""}); saveDishes(); }
// ältere Einträge ohne Kalorien/Kohlenhydrate: "keine Angabe"
[meals, dishes].forEach(l => l.forEach(m => { if (m.carbs === undefined) m.carbs = null; if (m.kcal === undefined) m.kcal = null; }));

// Anzeige-Einstellungen: welche Werte, ob Zahlen
const VKEY = "naehrwerte.view.v1";
let view = {show: NUTR.map(n => n.k), numbers: false};
try {
  const v = JSON.parse(localStorage.getItem(VKEY)), ks = ((v && v.show) || []).filter(k => NUTR.some(n => n.k === k));
  if (ks.length) view = {show: ks, numbers: !!v.numbers};
} catch (e) {}
function saveView() { try { localStorage.setItem(VKEY, JSON.stringify(view)); } catch (e) {} }
const vis = () => NUTR.filter(n => view.show.includes(n.k));

const PKEY = "naehrwerte.profile.v1";
let profile = null;   // {weight, height, limits}
try { profile = JSON.parse(localStorage.getItem(PKEY)); } catch (e) {}
if (profile && profile.limits) LIMITS = withDefaults(profile.limits);
function saveProfile() { try { localStorage.setItem(PKEY, JSON.stringify(profile)); } catch (e) {} }

const AKEY = "naehrwerte.apikey";
const getKey = () => { try { return localStorage.getItem(AKEY) || ""; } catch (e) { return ""; } };
const LIMITS_SYSTEM = 'Du bestimmst Orientierungsgrenzen für die Bewertung von Kalorien (kcal), Kohlenhydraten, Fett, Zucker, Protein und Ballaststoffen (alles außer Kalorien in Gramm). Für jeden Kontext (day, meal, snack) und jeden Nährstoff (kcal, carbs, fat, sugar, protein, fiber) gibt es vier aufsteigende Grenzen t1 bis t4: unter t1 sehr niedrig, t1 bis t2 niedrig, t2 bis t3 gut, t3 bis t4 hoch, ab t4 sehr hoch. Antworte ausschließlich mit JSON in exakt der Struktur der übergebenen Standardgrenzen, ohne Erklärung und ohne Markdown.';

async function requestLimits({weight, height, age, gender}) {
  const parts = [weight && weight + " kg", height && height + " cm", age && age + " Jahre", gender].filter(Boolean);
  const prompt = `Person: ${parts.join(", ")}. (Nicht genannte Angaben sind unbekannt.)\nStandardgrenzen für eine durchschnittliche erwachsene Person (70 kg, 175 cm):\n${JSON.stringify(DEFAULT_LIMITS)}\nPasse die Grenzen an die genannten Angaben an. Für fehlende Angaben gelten die Standardwerte.`;
  const r = await callClaude([{type: "text", text: prompt}], LIMITS_SYSTEM, 2000);
  const out = {};
  for (const ctx in DEFAULT_LIMITS) {
    out[ctx] = {};
    for (const k in DEFAULT_LIMITS[ctx]) {
      const a = r[ctx] && r[ctx][k];
      if (!Array.isArray(a) || a.length !== 4 || a.some((x, i) => typeof x !== "number" || !(x > 0) || (i && x <= a[i - 1])))
        throw new Error("Ungültige Grenzwerte von der KI erhalten.");
      out[ctx][k] = a;
    }
  }
  return out;
}

/* ===== KI-Anbindung ===== */
const MODELS = {"claude-haiku-5-5": "Haiku 5.5 (günstig)", "claude-sonnet-5-5": "Sonnet 5.5 (genauer, teurer)"};
const MKEY = "naehrwerte.model";
let MODEL = "claude-haiku-5-5";
try { const m = localStorage.getItem(MKEY); if (MODELS[m]) MODEL = m; } catch (e) {}
const IMG_MAX = 1024;               // längste Bildkante in Pixel (kleiner = billiger, ca. Breite x Höhe / 750 Tokens)
const ANALYZE_SYSTEM = 'Du bist ein Ernährungsassistent. Schätze die Nährwerte der gesamten gezeigten bzw. beschriebenen Portion. Mengenangaben im Text haben Vorrang vor der Schätzung per Foto. Antworte ausschließlich mit JSON ohne Erklärung und ohne Markdown im Format {"name": "kurzer deutscher Name des Gerichts", "kcal": Kilokalorien, "carbs": Gramm, "fat": Gramm, "sugar": Gramm, "protein": Gramm, "fiber": Gramm, "comment": "Kurzbewertung"}. carbs sind alle Kohlenhydrate inklusive Zucker, sugar ist der Gesamtzucker. Alle Werte außer name und comment sind ganze Zahlen. Der comment ist eine sachliche, freundliche Bewertung der Mahlzeit auf Deutsch in 1 bis 2 Sätzen (maximal 220 Zeichen). Er geht auf die Nährwerte ein (Energie, Kohlenhydrate, Fett, Zucker, Eiweiß, Ballaststoffe) und nennt, wenn sinnvoll, eine kurze Ergänzung.';

async function callClaude(content, system, maxTokens) {
  const key = getKey();
  if (!key) throw new Error("Bitte zuerst den API-Schlüssel unter ⚙ eintragen.");
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01",
                "anthropic-dangerous-direct-browser-access": "true"},
      body: JSON.stringify({model: MODEL, max_tokens: maxTokens, system, messages: [{role: "user", content}]})
    });
  } catch (e) { throw new Error("Keine Verbindung zur KI."); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data.error && data.error.message) || "API-Fehler " + res.status);
  const text = (data.content || []).map(c => c.text || "").join("");
  const i = text.indexOf("{"), j = text.lastIndexOf("}");
  if (i < 0 || j < i) throw new Error("Unerwartete Antwort der KI (Stop: " + (data.stop_reason || "?") + ", Blöcke: " + ((data.content || []).map(c => c.type).join("/") || "keine") + ")" + (text ? ": " + text.slice(0, 120) : ""));
  try { return JSON.parse(text.slice(i, j + 1)); } catch (e) { throw new Error("Die Antwort der KI war kein gültiges JSON."); }
}

async function shrink(file) {   // Foto verkleinern und als Base64-JPEG liefern
  const bmp = await createImageBitmap(file, {imageOrientation: "from-image"});
  const k = Math.min(1, IMG_MAX / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.8).split(",")[1];
}

async function analyzeMeal(photo, text, type) {
  const content = [];
  if (photo) content.push({type: "image", source: {type: "base64", media_type: "image/jpeg", data: await shrink(photo)}});
  content.push({type: "text", text: `Art: ${type === "snack" ? "Snack" : "Mahlzeit"}\nBeschreibung: ${text.trim() || "(keine, bitte nur nach dem Foto schätzen)"}`});
  const r = await callClaude(content, ANALYZE_SYSTEM, 1000);
  const num = v => Math.max(0, Math.round(Number(v)));
  const out = {name: String(r.name || "Mahlzeit").slice(0, 60), fat: num(r.fat), sugar: num(r.sugar), protein: num(r.protein), fiber: num(r.fiber), carbs: num(r.carbs), kcal: num(r.kcal), comment: String(r.comment || "").slice(0, 300)};
  if ([out.fat, out.sugar, out.protein, out.fiber, out.carbs, out.kcal].some(Number.isNaN)) throw new Error("Unvollständige Antwort der KI.");
  out.note = "KI-Schätzung, nur ungefähre Werte.";
  return out;
}

/* ===== Darstellung ===== */
const level = (v, t) => v == null ? -1 : t.filter(x => v >= x).length;
const cls = lv => lv < 0 ? "x" : COLOR[lv];
const sum = list => NUTR.reduce((o, n) => {
  const v = list.map(m => m[n.k]).filter(x => x != null);
  o[n.k] = v.length ? v.reduce((a, b) => a + b, 0) : null;
  return o;
}, {});

function ring(vals, ctx, big) {
  const r = 38, vs = vis(), N = vs.length, span = 360 / N, gap = 6;
  const pt = a => { const t = a * Math.PI / 180; return (50 + r * Math.sin(t)).toFixed(2) + " " + (50 - r * Math.cos(t)).toFixed(2); };
  let svg = "", desc = [];
  vs.forEach((n, i) => {
    const a1 = i * span + gap / 2, a2 = (i + 1) * span - gap / 2;
    const lv = vals ? level(vals[n.k], LIMITS[ctx][n.k]) : -1;
    const arc = (x, y, c) => `<path class="${c}" d="M${pt(x)} A${r} ${r} 0 ${y - x > 180 ? 1 : 0} 1 ${pt(y)}" fill="none" stroke-width="14"/>`;
    svg += arc(a1, a2, "l-x");
    if (lv >= 0) svg += arc(a1, a1 + (a2 - a1) * FILL[lv], "l-" + COLOR[lv]);
    if (big) {
      const m = (a1 + a2) / 2 * Math.PI / 180, q = 20;
      svg += `<text x="${(50 + q * Math.sin(m)).toFixed(1)}" y="${(50 - q * Math.cos(m)).toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="${N > 4 ? 8 : 10}" font-weight="700" style="fill:var(--muted)">${n.s}</text>`;
    }
    desc.push(n.n + ": " + (lv < 0 ? "keine Angabe" : LEVELS[lv]));
  });
  return `<svg class="ring${big ? " big" : ""}" viewBox="0 0 100 100" role="img" aria-label="${desc.join(", ")}">${svg}</svg>`;
}

function stats(vals, ctx) {
  return `<div class="grid">` + vis().map(n => {
    const v = vals[n.k], lv = level(v, LIMITS[ctx][n.k]);
    const t = lv < 0 ? "keine Angabe" : LEVELS[lv] + (view.numbers ? " · " + v + " " + n.u : "");
    return `<div class="cell"><b><i class="dot l-${cls(lv)}"></i>${n.n}</b><small>${t}</small></div>`;
  }).join("") + `</div>`;
}

/* ===== Ansichten ===== */
function viewStart() {
  const rows = [...Array(14)].map((_, i) => {
    const d = daysAgo(i), ms = meals.filter(m => m.date === d), t = ms.length ? sum(ms) : null;
    return `<a class="card" href="#/tag/${d}">${ring(t, "day")}<div class="info"><h3>${label(d)}</h3>${t ? stats(t, "day") : '<p class="muted">Keine Einträge</p>'}</div></a>`;
  }).join("");
  return `<div class="top"><h1>Nährwerte</h1><a class="gear" href="#/profil" aria-label="Körperdaten und Limits">⚙</a></div><p class="muted">Letzte 14 Tage</p><h2></h2>${rows}
    <button class="text-btn" id="reset">Dummydaten neu laden</button>
    <a class="fab" href="#/neu/${daysAgo(0)}" aria-label="Mahlzeit hinzufügen">+</a>`;
}

function viewDay(d) {
  const ms = meals.filter(m => m.date === d).sort((a, b) => a.time.localeCompare(b.time));
  const t = ms.length ? sum(ms) : null;
  const items = ms.map(m => `<article class="card">${ring(m, m.type)}<div class="info"><h3>${esc(m.name)}</h3>
    <p class="muted">${m.type === "snack" ? "Snack" : "Mahlzeit"}</p>${stats(m, m.type)}${m.comment ? `<p class="cmt">${esc(m.comment)}</p>` : ""}
    <button class="del" data-id="${m.id}">Löschen</button><button class="text-btn" data-keep="${m.id}" style="margin-left:16px;font-size:.85rem;text-decoration:none">Als Gericht speichern</button></div></article>`).join("");
  return `<a class="back" href="#/">‹ Übersicht</a><h1>${label(d)}</h1>
    <section class="card" style="margin-top:12px">${ring(t, "day", 1)}<div class="info">${t ? stats(t, "day") : '<p class="muted">Noch nichts erfasst.</p>'}</div></section>
    <h2>Mahlzeiten</h2>${items || '<p class="muted" style="margin-bottom:12px">Keine Mahlzeiten an diesem Tag.</p>'}
    <a class="primary" href="#/neu/${d}">Mahlzeit hinzufügen</a>`;
}

function viewAdd(d) {
  return `<button class="back text-btn" id="back" style="text-decoration:none;color:var(--accent);font-weight:600">‹ Zurück</button>
    <h1>Mahlzeit hinzufügen</h1><p class="muted">für ${label(d)}</p><h2></h2>
    <div class="seg" role="radiogroup" aria-label="Art">
      <label><input type="radio" name="type" value="meal" checked><span>Mahlzeit</span></label>
      <label><input type="radio" name="type" value="snack"><span>Snack</span></label>
    </div>
    ${dishes.length ? `<section class="panel"><label class="l" for="dish">Gespeichertes Gericht</label>
      <select class="num" id="dish"><option value="">– stattdessen Foto oder Text –</option>${dishes.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></section>` : ""}
    <div id="input">
    <section class="panel">
      <input id="file" type="file" accept="image/*" capture="environment" hidden>
      <button type="button" class="photo-btn" id="photoBtn">Foto aufnehmen</button>
      <img id="preview" alt="Vorschau der Mahlzeit" hidden>
      <button type="button" class="text-btn" id="rmPhoto" hidden>Foto entfernen</button>
    </section>
    <section class="panel"><label class="l" for="text">Beschreibung (optional)</label>
      <textarea id="text" placeholder="z. B. 200 g Spaghetti mit Tomatensoße und Parmesan"></textarea></section>
    <button class="primary" id="go" disabled>Nährwerte berechnen</button></div>
    <div class="err" id="err" hidden></div>
    <section class="panel" id="result" style="margin-top:16px" hidden aria-live="polite"></section>`;
}

function viewProfile() {
  const p = profile || {};
  return `<a class="back" href="#/">‹ Übersicht</a><h1>Einstellungen</h1>
    <p class="muted">Aus diesen Angaben bestimmt die KI deine persönlichen Limits. Alle Felder sind optional, ohne Angaben gelten Standardwerte.</p><h2></h2>
    <section class="panel">
      <label class="l" for="weight">Gewicht (kg, optional)</label>
      <input class="num" id="weight" type="number" inputmode="decimal" min="30" max="300" step="0.1" value="${p.weight || ""}">
      <label class="l" for="height" style="margin-top:14px">Körpergröße (cm, optional)</label>
      <input class="num" id="height" type="number" inputmode="numeric" min="100" max="250" step="1" value="${p.height || ""}">
      <label class="l" for="age" style="margin-top:14px">Alter (Jahre, optional)</label>
      <input class="num" id="age" type="number" inputmode="numeric" min="10" max="110" step="1" value="${p.age || ""}">
      <label class="l" for="gender" style="margin-top:14px">Geschlecht (optional)</label>
      <select class="num" id="gender">${[["", "– keine Angabe –"], ["weiblich", "weiblich"], ["männlich", "männlich"], ["divers", "divers"]].map(([v, n]) => `<option value="${v}"${v === (p.gender || "") ? " selected" : ""}>${n}</option>`).join("")}</select>
    </section>
    <button class="primary" id="send">Senden</button>
    <div class="err" id="perr" hidden></div>
    <p class="muted" id="pok" style="margin-top:12px" hidden>Limits aktualisiert. Alle Ringe nutzen jetzt die neuen Werte.</p>
    <h2>Anzeige</h2>
    <section class="panel">
      ${NUTR.map(n => `<label class="chk"><input type="checkbox" data-show="${n.k}"${view.show.includes(n.k) ? " checked" : ""}>${n.n}</label>`).join("")}
      <label class="chk" style="margin-top:6px;padding-top:14px;border-top:1px solid var(--line)"><input type="checkbox" id="numbers"${view.numbers ? " checked" : ""}>Zahlenwerte anzeigen</label>
    </section>
    <h2>KI-Zugang</h2>
    <section class="panel"><label class="l" for="model">Modell</label>
      <select class="num" id="model" style="margin-bottom:14px">${Object.entries(MODELS).map(([id, n]) => `<option value="${id}"${id === MODEL ? " selected" : ""}>${n}</option>`).join("")}</select>
      <label class="l" for="key">API-Schlüssel</label>
      <input class="num" id="key" type="password" autocomplete="off" placeholder="sk-ant-…" value="${esc(getKey())}">
      <button type="button" class="text-btn" id="saveKey">Schlüssel speichern</button>
      <p class="muted" id="kok" hidden>Gespeichert (nur auf diesem Gerät).</p></section>
    <h2>Gespeicherte Gerichte</h2>
    ${dishes.length ? dishes.map(x => `<div class="card" style="padding:10px 14px"><div class="info"><b>${esc(x.name)}</b>
      <div class="muted">${x.type === "snack" ? "Snack" : "Mahlzeit"}</div></div><button class="del" data-dish="${x.id}">Löschen</button></div>`).join("")
      : '<p class="muted">Noch keine Gerichte gespeichert.</p>'}`;
}

/* ===== Ereignisse ===== */
const app = document.getElementById("app");

function bindStart() {
  document.getElementById("reset").onclick = () => {
    if (confirm("Alle Einträge durch neue Dummydaten ersetzen?")) { meals = seed(); save(); route(); }
  };
}
function bindDay() {
  app.querySelectorAll("[data-keep]").forEach(b => b.onclick = () => {
    const m = meals.find(x => x.id === b.dataset.keep); if (!m) return;
    addDish(m, m.type); b.textContent = "Gespeichert ✓"; b.disabled = true;
  });
  app.querySelectorAll(".del").forEach(b => b.onclick = () => {
    if (confirm("Diese Mahlzeit löschen?")) { meals = meals.filter(m => m.id !== b.dataset.id); save(); route(); }
  });
}
function bindProfile() {
  const $ = id => document.getElementById(id);
  $("saveKey").onclick = () => {
    try { localStorage.setItem(AKEY, $("key").value.trim()); } catch (e) {}
    $("kok").hidden = false;
  };
  app.querySelectorAll("[data-show]").forEach(c => c.onchange = () => {
    const ks = [...app.querySelectorAll("[data-show]")].filter(x => x.checked).map(x => x.dataset.show);
    if (!ks.length) { c.checked = true; return; }   // mindestens ein Wert bleibt sichtbar
    view.show = ks; saveView();
  });
  $("numbers").onchange = () => { view.numbers = $("numbers").checked; saveView(); };
  $("model").onchange = () => { MODEL = $("model").value; try { localStorage.setItem(MKEY, MODEL); } catch (e) {} };
  app.querySelectorAll("[data-dish]").forEach(b => b.onclick = () => {
    if (confirm("Dieses Gericht löschen?")) { dishes = dishes.filter(x => x.id !== b.dataset.dish); saveDishes(); route(); }
  });
  $("send").onclick = async () => {
    const num = id => { const v = parseFloat($(id).value); return isNaN(v) ? null : v; };
    const w = num("weight"), h = num("height"), age = num("age"), gender = $("gender").value;
    $("perr").hidden = true;
    if ((w !== null && !(w >= 30 && w <= 300)) || (h !== null && !(h >= 100 && h <= 250)) || (age !== null && !(age >= 10 && age <= 110))) {
      $("perr").textContent = "Bitte gültige Werte angeben: Gewicht 30–300 kg, Körpergröße 100–250 cm, Alter 10–110 Jahre.";
      $("perr").hidden = false; return;
    }
    $("send").disabled = true; $("send").textContent = "Wird gesendet …";
    try {
      const limits = (w || h || age || gender) ? await requestLimits({weight: w, height: h, age, gender}) : DEFAULT_LIMITS;
      profile = {weight: w, height: h, age, gender, limits}; LIMITS = limits; saveProfile();
      app.innerHTML = viewProfile(); bindProfile(); document.getElementById("pok").hidden = false;
    } catch (e) {
      $("perr").textContent = "Die Anfrage ist fehlgeschlagen: " + e.message; $("perr").hidden = false;
      $("send").disabled = false; $("send").textContent = "Senden";
    }
  };
}
function bindAdd(d) {
  const $ = id => document.getElementById(id);
  let photo = null, type = "meal", dish = null;
  const stale = () => { $("result").hidden = true; };
  const upd = () => { $("go").disabled = !(photo || $("text").value.trim()); };
  const NOTE = "Gespeichertes Gericht, keine KI-Anfrage nötig.";

  function show(r, note) {
    $("result").innerHTML = `<h2 style="margin-top:0">Nährwerte</h2><h3>${esc(r.name)}</h3>
      <div class="row">${ring(r, type, 1)}<div class="info">${stats(r, type)}</div></div>
      ${r.comment ? `<p class="cmt">${esc(r.comment)}</p>` : ""}
      <p class="muted" style="margin:10px 0 14px">${esc(note || "")}</p>
      <button class="primary" id="save">Zum Tag hinzufügen</button>
      ${dish ? "" : '<button class="text-btn" id="keep">Als Gericht speichern</button>'}`;
    $("result").hidden = false;
    $("save").onclick = () => {
      const now = new Date();
      meals.push(mk(d, type, d === ymd(now) ? pad(now.getHours()) + ":" + pad(now.getMinutes()) : "12:00",
                    r));
      save(); location.replace("#/tag/" + d);
    };
    if (!dish) $("keep").onclick = () => { addDish(r, type); $("keep").textContent = "Gericht gespeichert ✓"; $("keep").disabled = true; };
    $("result").scrollIntoView({behavior: "smooth", block: "nearest"});
  }

  $("back").onclick = () => history.length > 1 ? history.back() : (location.hash = "#/tag/" + d);
  $("photoBtn").onclick = () => $("file").click();
  $("file").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    photo = f; $("preview").src = URL.createObjectURL(f);
    $("preview").hidden = $("rmPhoto").hidden = false;
    $("photoBtn").textContent = "Anderes Foto aufnehmen"; stale(); upd();
  };
  $("rmPhoto").onclick = () => {
    photo = null; $("file").value = ""; $("preview").hidden = $("rmPhoto").hidden = true;
    $("photoBtn").textContent = "Foto aufnehmen"; stale(); upd();
  };
  $("text").oninput = () => { stale(); upd(); };
  app.querySelectorAll('input[name="type"]').forEach(r => r.onchange = () => { type = r.value; dish ? show(dish, NOTE) : stale(); });

  if ($("dish")) $("dish").onchange = () => {
    dish = dishes.find(x => x.id === $("dish").value) || null;
    $("input").hidden = !!dish;
    if (dish) {
      type = dish.type;
      app.querySelector('input[name="type"][value="' + type + '"]').checked = true;
      show(dish, NOTE);
    } else { stale(); upd(); }
  };

  $("go").onclick = async () => {
    $("err").hidden = true; $("go").disabled = true; $("go").textContent = "Wird berechnet …";
    try {
      const r = await analyzeMeal(photo, $("text").value, type);
      show(r, r.note);
    } catch (e) {
      $("err").textContent = "Die Berechnung ist fehlgeschlagen: " + e.message; $("err").hidden = false;
    } finally { $("go").textContent = "Nährwerte berechnen"; upd(); }
  };
}

/* ===== Navigation (Hash-Routing, Zurück-Taste funktioniert) ===== */
function route() {
  const p = (location.hash.replace(/^#/, "") || "/").split("/");
  const okDate = /^\d{4}-\d\d-\d\d$/.test(p[2] || "");
  window.scrollTo(0, 0);
  if (p[1] === "tag" && okDate)      { app.innerHTML = viewDay(p[2]);  bindDay(); }
  else if (p[1] === "neu" && okDate) { app.innerHTML = viewAdd(p[2]);  bindAdd(p[2]); }
  else if (p[1] === "profil") { app.innerHTML = viewProfile(); bindProfile(); }
  else { app.innerHTML = viewStart();    bindStart(); }
}
addEventListener("hashchange", route);
document.addEventListener("visibilitychange", () => {   // neuer Tag nach Mitternacht
  if (!document.hidden && !/^#\/(neu|profil)/.test(location.hash)) route();
});
route();
</script>
</body>
</html>
